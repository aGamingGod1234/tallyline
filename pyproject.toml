[project]
name = "tallyline"
version = "0.1.0"
description = "Evidence-first grant closeout agent for small community organizations"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}
dependencies = [
  "fastapi>=0.162,<1",
  "uvicorn[standard]>=0.54,<1",
  "pydantic>=2.14.1,<3",
  "strands-agents[gemini]>=1.62,<2",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.1,<1",
  "playwright>=1.64.1,<2",
  "pytest>=9.1.1,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
